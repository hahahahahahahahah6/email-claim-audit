[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "email-claim-audit"
version = "0.1.0"
description = "Static audit of documented outbound-mail promises"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
email-claim-audit = "email_claim_audit.cli:main"

[tool.setuptools.packages.find]
include = ["email_claim_audit*"]
